services:
  yacsrcon:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.local
    environment:
      DATABASE_PATH: /app/data/yacsrcon.db
      SESSION_PATH: /app/data/yacsrcon.sessions.json
      AUDIT_PATH: /app/data/yacsrcon.jsonl
    volumes:
      - ./data:/app/data
